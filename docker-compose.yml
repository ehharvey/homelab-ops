services:
  web:
    build: .
    ports:
      # Published on the host's localhost only: see API_HOST_LISTEN_ADDR.
      - "127.0.0.1:8080:8080"
      - "51820:51820/udp"
    environment:
      # Dev opts in to the plain-HTTP host listener (#195, docs/Decisions.md
      # §28), so curl and the compose validate scripts can call the API. The
      # shipped default is tunnel-only, with no host listener at all.
      # Inside the container it binds every interface so the published port
      # reaches it; the publish above keeps it on the host's 127.0.0.1.
      # scripts/validate/api-serves-operator-peers-over-tunnel-by-default.sh
      # blanks it to exercise the default.
      - API_HOST_LISTEN_ADDR=:8080
      - CONFIG_REPO_URL=git://config-repo/fleet.git
      - CONFIG_REPO_REF=main
      - WIREGUARD_PORT=51820
      # WIREGUARD_ENDPOINT deliberately unset here: this dev stack has no
      # real node to tunnel to, so the tunnel stays unconfigured (see
      # newTunnelSource) — scripts/validate/node-tunnel-survives-nat-and-provisions.sh exercises it
      # against a real booted node instead.
    depends_on:
      - config-repo

  config-repo:
    build: ./dev/git-fixture

  # Dev-only, and off by default: `profiles` keeps it out of a bare
  # `docker compose up` and out of the validate suite, whose compose() helper
  # (scripts/validate/lib-compose.sh) passes no --profile. Start it explicitly:
  #
  #   mkdir -p /tmp/incus-bridge
  #   INCUS_BRIDGE_HOST_ADDR="$(getent hosts host.docker.internal | awk '{print $1}'):8443" \
  #     docker compose --profile incus-bridge up -d incus-bridge
  #
  # Then point unix-socket code at it, e.g.
  #   VALIDATE_INCUS_SOCKET=/tmp/incus-bridge/incus.sock \
  #     ./scripts/validate/incuslocal-round-trips-instances-over-unix-socket.sh
  #
  # The host address is passed explicitly rather than using
  # `host.docker.internal:host-gateway`: this devcontainer runs docker-in-docker,
  # so inside a nested container host-gateway resolves to the devcontainer
  # itself, not the machine running Incus (verified — unreachable that way,
  # reachable via the address the devcontainer resolves).
  incus-bridge:
    profiles: ["incus-bridge"]
    build: ./dev/incus-bridge
    # The socket grants whatever the mounted client certificate is trusted for,
    # so it is owned by the devcontainer's own uid and mode 600 rather than
    # world-accessible.
    user: "1000:1000"
    environment:
      # Not `${...:?}`: compose interpolates every service before filtering by
      # profile, so a required-variable error here would break a plain
      # `docker compose up` — and the validate suite's compose group — for
      # anyone who never starts this bridge. The entrypoint enforces it
      # instead, at the only moment it matters.
      - INCUS_BRIDGE_HOST_ADDR=${INCUS_BRIDGE_HOST_ADDR:-}
      - INCUS_BRIDGE_SERVER_NAME=${INCUS_BRIDGE_SERVER_NAME:-pc0}
      - INCUS_BRIDGE_SERVER_CERT=${INCUS_BRIDGE_SERVER_CERT:-/certs/servercerts/homelab-host.crt}
    volumes:
      - ${INCUS_BRIDGE_CONFIG_DIR:-/home/vscode/.config/incus}:/certs:ro
      - ${INCUS_BRIDGE_SOCKET_DIR:-/tmp/incus-bridge}:/socket

  # A local OCI registry for the agent image (#102), so dev and validation can
  # deploy an agent build without pushing to GHCR or holding cloud
  # credentials:
  #
  #   docker build -f Dockerfile.agent -t localhost:5000/agent:dev .
  #   docker push localhost:5000/agent:dev
  #
  # Inside the stack it is http://registry:5000, which is what an agent App's
  # image.server points at for a local build (internal/config's ImageRef).
  registry:
    image: registry:3.0.0
    ports:
      - "5000:5000"

  loki:
    image: grafana/loki:3.7.3
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.13.0
    ports:
      - "9090:9090"
    volumes:
      - ./dev/observability-stack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dev/observability-stack/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
