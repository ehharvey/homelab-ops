version: ""
apply_defaults: true
preseed:
    config:
        cluster.https_address: 192.168.1.201:8443
        core.https_address: :8443
    networks: []
    storage_pools: []
    storage_volumes: []
    profiles:
        - config: {}
          description: This host's Incus API socket, at /dev/incus-host.sock inside the instance
          devices:
            incus-socket:
                bind: instance
                connect: unix:/var/lib/incus/unix.socket
                listen: unix:/dev/incus-host.sock
                type: proxy
          name: incus-socket
          project: default
    projects: []
    certificates:
        - name: node0
          type: client
          restricted: false
          projects: []
          certificate: 
          description: ""
          trust_token: ""
          token: false
        - name: node0-bootstrap
          type: client
          restricted: false
          projects: []
          certificate: 
          description: ""
          trust_token: ""
          token: false
    cluster_groups: []
    cluster:
        server_name: node0
        enabled: true
        member_config: []
        cluster_address: ""
        cluster_certificate: ""
        server_address: ""
        cluster_token: ""
        cluster_certificate_path: ""
