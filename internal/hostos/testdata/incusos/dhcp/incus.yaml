version: ""
apply_defaults: true
preseed:
    config: {}
    networks: []
    storage_pools: []
    storage_volumes: []
    profiles:
        - config: {}
          description: This host's Incus API socket, at /dev/incus-host.sock inside the instance
          devices:
            incus-socket:
                bind: instance
                connect: unix:/var/lib/incus/unix.socket
                listen: unix:/dev/incus-host.sock
                type: proxy
          name: incus-socket
          project: default
    projects: []
    certificates:
        - name: node0
          type: client
          restricted: false
          projects: []
          certificate: 
          description: ""
          trust_token: ""
          token: false
    cluster_groups: []
    cluster: null
