name: Bump incus-os submodule

# Checks lxc/incus-os for new tags and opens a PR bumping third_party/incus-os
# (and re-vendoring internal/third_party/incusos) when one is found. The submodule is the
# git-tracked pointer to the exact upstream commit our seed structs match
# (see Development Conventions § Vendoring upstream IncusOS seed structs).
#
# A second, independent job (bump-base-pin, #296) moves the IncusOS base-image
# pin, scripts/incusos-base.version, to the CDN's newest `stable` build. The pin
# is not the submodule tag (not every tag gets a CDN build), so it gets its own
# branch and PR, runs whether or not there is a new tag, and never touches the
# submodule PR's diff.
#
# The submodule PR is opened with ISSUE264_REBASE_BOT_PAT (#287), so its push
# triggers the required checks (build-test, lint, docker-smoke, one-commit).
# scripts/incusos-bump-is-trivial.sh then decides whether the bump is
# provenance-only: the submodule pointer plus the `// Vendored from ... @ <sha>`
# stamps and nothing else. Only then does the job enable auto-merge, with the
# same PAT, so the merge is attributed to a real user and push-triggered
# workflows on main (ci.yml, sync-wiki.yml) still fire. Every other bump waits
# for a human `make lgtm`, and its PR body lists what changed beyond the stamps.
#
# GITHUB_TOKEN is read-only by default (#332); only bump-base-pin is granted
# write, since check-and-bump writes through the PAT alone.
#
# The pin PR is opened with GITHUB_TOKEN, and a GITHUB_TOKEN push triggers no
# workflows: it arrives without the required checks and stays blocked until the
# operator pushes to the branch. That wait is accepted: refreshing a pinned
# image is meant to be a conscious act (docs/Decisions.md §21). See
# scripts/validate/README.md.
#
# Dispatching this from a branch other than main rebuilds the bump branches on
# top of THAT branch: both jobs commit onto whatever ref was checked out, so the
# real chore/bump-incus-os PR picks up the branch's commits. The `test_mode`
# input exists so the pin job can be proven from a feature branch without that:
# it skips the submodule job entirely and puts the pin PR on a per-run branch.
# scripts/validate/bump-workflow-opens-pin-only-pr.sh is its only intended
# caller; never dispatch from a non-main ref without it.

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour to avoid GH Actions scheduling pile-ups
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test run from a throwaway branch: skip the submodule job, open the pin PR on a per-run branch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-and-bump:
    # `inputs` is empty on a schedule, so this is true for every real run.
    if: ${{ !inputs.test_mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init sparse incus-os submodule
        run: |
          git submodule update --init -- third_party/incus-os
          git -C third_party/incus-os sparse-checkout init --cone
          git -C third_party/incus-os sparse-checkout set incus-osd/api

      - name: Check for a new tag
        id: check
        run: |
          cd third_party/incus-os
          git fetch --tags origin
          current_sha=$(git rev-parse HEAD)
          latest_tag=$(git tag -l | sort | tail -1)
          latest_sha=$(git rev-list -n1 "$latest_tag")
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" = "$latest_sha" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7.0.0
        if: steps.check.outputs.up_to_date == 'false'
        with:
          go-version: "1.26"
          cache: true

      - name: Bump submodule and re-vendor
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git -C third_party/incus-os checkout "${{ steps.check.outputs.latest_tag }}"
          git -C third_party/incus-os sparse-checkout set incus-osd/api
          ./scripts/vendor-incusos.sh

      - name: Build and test against the new vendored structs
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          go build ./...
          go test ./...

      # Reads the uncommitted working tree, which is exactly what
      # create-pull-request is about to commit. Exit 0 = provenance-only,
      # 1 = needs review; anything else fails the job.
      - name: Classify the bump
        id: classify
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          rc=0
          ./scripts/incusos-bump-is-trivial.sh > "$RUNNER_TEMP/classify.md" || rc=$?
          case "$rc" in
            0) trivial=true ;;
            1) trivial=false ;;
            *) exit "$rc" ;;
          esac
          cat "$RUNNER_TEMP/classify.md"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "trivial=$trivial"
            echo "report<<$delim"
            cat "$RUNNER_TEMP/classify.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # The PAT, not GITHUB_TOKEN: a GITHUB_TOKEN push triggers no workflows,
      # so the required checks would never start and auto-merge would hang.
      - uses: peter-evans/create-pull-request@v8.1.1
        id: cpr
        if: steps.check.outputs.up_to_date == 'false'
        with:
          token: ${{ secrets.ISSUE264_REBASE_BOT_PAT }}
          branch: chore/bump-incus-os
          delete-branch: true
          title: "Bump lxc/incus-os to ${{ steps.check.outputs.latest_tag }}"
          commit-message: "Bump lxc/incus-os submodule to ${{ steps.check.outputs.latest_tag }}"
          body: |
            Bumps the `third_party/incus-os` submodule to tag
            `${{ steps.check.outputs.latest_tag }}` and re-vendors
            `internal/third_party/incusos` via `scripts/vendor-incusos.sh`.

            ${{ steps.classify.outputs.report }}

            The path was chosen by `scripts/incusos-bump-is-trivial.sh`
            (Development Conventions § Vendoring upstream IncusOS seed structs).
          labels: dependencies

      # Auto-merge is enabled with the PAT too, so the merge is attributed to
      # its user rather than github-actions[bot] and the push to main triggers
      # ci.yml and sync-wiki.yml. On the review path it is switched off, in
      # case an earlier provenance-only run left it on for this same PR.
      - name: Set auto-merge from the classification
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.ISSUE264_REBASE_BOT_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          TRIVIAL: ${{ steps.classify.outputs.trivial }}
        run: |
          if [ "$TRIVIAL" = true ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --rebase --delete-branch
            echo "Provenance-only: auto-merge enabled on #$PR"
          elif [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
            echo "Needs review: auto-merge disabled on #$PR"
          else
            echo "Needs review: auto-merge stays off on #$PR"
          fi

  bump-base-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # The one resolution path: the newest version the S/MIME-verified
      # os/index.sjson lists on the `stable` channel.
      - name: Resolve the newest stable IncusOS on the CDN
        id: pin
        run: |
          latest=$(./scripts/fetch-incusos-base.sh --latest-stable)
          current=$(tr -d '[:space:]' < scripts/incusos-base.version)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "$latest" > scripts/incusos-base.version
          fi

      - uses: peter-evans/create-pull-request@v8.1.1
        if: steps.pin.outputs.latest != steps.pin.outputs.current
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.test_mode && format('chore/bump-incusos-base-test-{0}', github.run_id) || 'chore/bump-incusos-base' }}
          delete-branch: true
          add-paths: scripts/incusos-base.version
          title: "${{ inputs.test_mode && 'DO NOT MERGE (test run): ' || '' }}Bump the IncusOS base image pin to ${{ steps.pin.outputs.latest }}"
          commit-message: "Bump the IncusOS base image pin to ${{ steps.pin.outputs.latest }}"
          body: |
            Moves `scripts/incusos-base.version` from
            `${{ steps.pin.outputs.current }}` to `${{ steps.pin.outputs.latest }}`,
            the newest `stable` build in the verified
            `https://images.linuxcontainers.org/os/index.sjson`.

            This PR was opened with `GITHUB_TOKEN`, so no workflow ran on it and
            its required checks are missing. Before merging, run
            `make incusos-base` on this branch, re-run the validate scripts
            that use the image, then push to the branch (an amend is enough)
            so the checks run. After the merge, every checkout's `[base-image]`
            checks skip until `make incusos-base` has cached the new version.
          labels: dependencies
