name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0

  # Builds the web image on every PR and push, proves it works, and publishes
  # it to GHCR from main only (#240): tagged with the commit SHA, plus latest.
  # The published image is the web app's deployment artifact (Decisions.md
  # §29: one image for both appliance host forms).
  #
  # The checks prove the distroless/static final stage actually works. The
  # image route (#39) shells out to flasher-tool, and no other CI job builds
  # this image, so a cgo/glibc/exec-format regression (e.g. flasher-tool
  # gaining a cgo dependency that no longer links static) would otherwise only
  # surface when someone runs image-route-streams-seeded-image.sh by hand.
  # distroless has no shell, so the binaries are invoked directly via
  # --entrypoint rather than through `sh -c`.
  #
  # The push is a step gated with `if:` rather than a separate job: the checks
  # before it gate it (steps run only while every earlier one succeeded), the
  # image is built once, and this required check still reports a status on
  # PRs. The concurrency group keeps two quick merges to main from racing:
  # without it the older commit's run can push latest last. cancel-in-progress
  # stays false so a push already under way finishes; a newer run queueing
  # cancels any older one still pending.
  docker-smoke:
    runs-on: ubuntu-latest
    concurrency:
      group: web-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ehharvey/homelab-ops/web
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t homelab-ops-web .
      - name: flasher-tool runs in the built image
        run: docker run --rm --entrypoint /flasher-tool homelab-ops-web --help
      - name: flasher-tool reports its version
        run: docker run --rm --entrypoint /flasher-tool homelab-ops-web --version
      # /healthz answers 200 even with no deployment config, and cmd/web
      # needs no environment (its health listener defaults to :8081,
      # STORE_PATH to :memory:), so a bare `docker run` is enough to prove the
      # app starts and serves. With no config, the API itself is on no
      # listener (#195).
      - name: web serves /healthz
        run: |
          docker run -d --name web-smoke -p 8081:8081 homelab-ops-web
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "/healthz did not answer 200 within 30s"
            docker logs web-smoke
            exit 1
          fi
      - name: stop the web container
        if: always()
        run: docker rm -f web-smoke >/dev/null 2>&1 || true
      - name: push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" latest; do
            docker tag homelab-ops-web "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  # Builds the agent image (#102) on every PR and push, and publishes it to
  # GHCR from main only: tagged with the commit SHA, plus latest, which the
  # agent App's image.alias tracks (examples/fleet/apps.yaml). The push step
  # is gated with `if:` rather than splitting the job, so the job reports a
  # status on PRs too. The concurrency group keeps two quick merges to main
  # from racing: without it the older commit's run can push latest last.
  # cancel-in-progress stays false so a push already under way finishes; a
  # newer run queueing cancels any older one still pending.
  agent-image:
    runs-on: ubuntu-latest
    concurrency:
      group: agent-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ehharvey/homelab-ops/agent
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.agent -t homelab-ops-agent .
      # The agent has no --help, so prove the binary executes in the
      # distroless final stage by running it with no environment: it must get
      # as far as rejecting its settings, rather than failing to exec.
      - name: agent runs in the built image
        run: |
          if out=$(docker run --rm homelab-ops-agent 2>&1); then
            echo "expected the agent to reject an empty environment; it exited 0"
            exit 1
          fi
          echo "$out"
          grep -q 'AGENT_NODE_NAME is required' <<<"$out"
      - name: push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" latest; do
            docker tag homelab-ops-agent "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
