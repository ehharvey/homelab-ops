name: Repo hygiene

# Nightly drift checks on issue state (#388): labels, blocked-by links and
# milestones change without a PR, so no PR check can catch them going stale.
# The checks live in scripts/hygiene.sh, which /next also runs. This job writes
# the summary into the open issue titled "Repo hygiene" (creating it when
# there's none; the operator pins it), and fails while any check finds drift,
# so drift shows as a red scheduled run.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

# GITHUB_TOKEN reads issues, PRs and milestones, and writes the hygiene issue.
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Repo hygiene
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Exit 0 is clean and 1 is drift (failed at the end, after the issue is
      # written); anything else, a SKIP included, is a broken run.
      - name: Run the checks
        id: checks
        run: |
          rc=0
          ./scripts/hygiene.sh >hygiene.jsonl || rc=$?
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" -le 1 ]

      - name: Update the Repo hygiene issue
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- Written by .github/workflows/hygiene.yml from scripts/hygiene.sh (#388). Every run overwrites this body. -->"
            echo "Last run: $(date -u '+%Y-%m-%d %H:%M UTC'), $RUN_URL"
            echo
            ./scripts/hygiene.sh --summary --from hygiene.jsonl || true
          } | head -c 60000 >body.md
          n=$(gh issue list --state open --limit 1000 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)] | first | .number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Fail on drift
        if: steps.checks.outputs.rc != '0'
        run: |
          echo "scripts/hygiene.sh found drift; see the Repo hygiene issue or the summary below."
          ./scripts/hygiene.sh --summary --from hygiene.jsonl || true
          exit 1
